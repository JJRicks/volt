name: Core and setup tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    # Private workers require trusted collaborators and disabled fork workflows.
    # Job/run labels route eligible work; they are not an authorization boundary.
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.actor == 'JJRicks' || github.actor == 'ollies5') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('["self-hosted","Linux","ARM64","volt-ci","volt-job-core-tests","volt-run-{0}-{1}"]', github.run_id, github.run_attempt) || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Run core suites
        run: |
          bash tests/run.sh
          python3 docs/validation/data/stock-pack-v6/fit_pack_model.py --check
          python3 tests/owner-capture-guard-test.py
          python3 tests/hardware-sweep-test.py
          python3 -m unittest discover -s ops/ci -p 'test_*.py' -q
  web-setup:
    # Private workers require trusted collaborators and disabled fork workflows.
    # Job/run labels route eligible work; they are not an authorization boundary.
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.actor == 'JJRicks' || github.actor == 'ollies5') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('["self-hosted","Linux","ARM64","volt-ci","volt-job-web-setup","volt-run-{0}-{1}"]', github.run_id, github.run_attempt) || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: setup/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: setup/web/package-lock.json
      - name: Install pinned browser-helper dependencies
        run: npm ci --ignore-scripts
      - name: Test capture, interruption and restoration
        run: npm test
      - name: Build local bundle and security headers
        run: npm run build
