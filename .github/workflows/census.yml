name: Census (G7) on emulators

# A run is requested by pushing a census-run/<name> branch whose ops/census/request.json names the
# base and head commits (ops/census/README.md). Standard GitHub-hosted runners only: free on this
# public repository. Nothing here uses secrets; the APKs are signed with a throwaway key made per run.
on:
  push:
    branches: ['census-run/**', '!census-run/probe-*']

permissions:
  contents: read

# One census or probe run at a time across every branch (census-probe.yml shares this group), so the
# run jobs (max-parallel 18) leave 2 of the free plan's 20 concurrent jobs for CI. A run pushed while
# another is going waits for it; GitHub keeps only the newest waiting run per group (it cancels an
# older waiting one), so push one census-run branch at a time.
concurrency:
  group: census-cloud
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ctl
      - name: Validate the request and plan shards
        id: plan
        run: python3 -I ctl/ops/census/plan.py ctl/ops/census/request.json "$RUNNER_TEMP/plan" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 36 and build-tools 36.1.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - name: Build every tree (VOLT_RELEASE=1) and the base tree's test APK
        run: bash ctl/ops/census/build-trees.sh "$RUNNER_TEMP/plan" "$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census-apks
          path: ${{ runner.temp }}/work/apks
          retention-days: 3
          if-no-files-found: error

  run:
    needs: build
    runs-on: ubuntu-latest
    # The longest shard is guided alone: 5 runs of about 15-20 min on the cloud emulator, plus about
    # 4 min of install and boot. A shard stops after 2 boot failures in a row (shard.sh).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ctl
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and the x86_64 system image
        run: bash ctl/ops/census/emulator.sh install
      - name: Create the census AVD
        run: bash ctl/ops/census/emulator.sh create
      - name: Fetch the base tree (its run-release-sweep.py runs every step)
        env:
          BASE_SHA: ${{ needs.build.outputs.base_sha }}
        run: bash ctl/ops/census/fetch-tree.sh "$BASE_SHA" "$RUNNER_TEMP/base"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: census-apks
          path: ${{ runner.temp }}/apks
      - name: Run this shard's steps (every tag on one emulator)
        env:
          CENSUS_SHARD: ${{ matrix.index }}
          CENSUS_STEPS: ${{ matrix.steps }}
        run: |
          export CENSUS_BASE_TAG="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["base"]["tag"])' "$RUNNER_TEMP/apks/plan.json")"
          export CENSUS_HEADS="$(python3 -I -c 'import json,sys; print(" ".join(h["tag"] for h in json.load(open(sys.argv[1]))["heads"]))' "$RUNNER_TEMP/apks/plan.json")"
          bash ctl/ops/census/shard.sh "$RUNNER_TEMP/base" "$RUNNER_TEMP/apks" "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: census-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/shard
          retention-days: 3
          if-no-files-found: warn

  diff:
    needs: [build, run]
    # Not after a cancel: a cancelled run's census-diff would be mostly missing runs.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ctl
      - name: Fetch the base tree (its census_diff.py compares)
        env:
          BASE_SHA: ${{ needs.build.outputs.base_sha }}
        run: bash ctl/ops/census/fetch-tree.sh "$BASE_SHA" "$RUNNER_TEMP/base"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: census-apks
          path: ${{ runner.temp }}/apks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: census-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/all
      - name: Compare every head with both base runs
        run: |
          P="$RUNNER_TEMP/apks"; D="$RUNNER_TEMP/diff"; mkdir -p "$D"
          base="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["base"]["tag"])' "$P/plan.json")"
          for h in $(python3 -I -c 'import json,sys; print(" ".join(h["tag"] for h in json.load(open(sys.argv[1]))["heads"]))' "$P/plan.json"); do
            echo "== $h"
            bash ctl/ops/census/diff.sh "$RUNNER_TEMP/base" "$RUNNER_TEMP/all" "$D" "$base-r1" "$base-r2" "$h" "$P/steps.txt"
          done
          cp "$P/plan.json" "$P/builds.txt" "$D/"
          set +e
          python3 -I ctl/ops/census/report.py "$P" "$RUNNER_TEMP/all" "$D" > "$D/summary.md"
          echo $? > "$D/report-rc.txt"
          cat "$D/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census-diff
          path: ${{ runner.temp }}/diff
          retention-days: 3
          if-no-files-found: error
      # Two checks, so the run's annotations say which one made it red. cloud-gaps.tsv steps are in
      # neither (report.py puts them in gaps.txt), so the colour only covers steps the cloud can run.
      - name: Fail when any run is missing or not clean
        run: |
          D="$RUNNER_TEMP/diff"
          if [ -s "$D/missing.txt" ] || [ -s "$D/not-clean.txt" ] || [ "$(cat "$D/report-rc.txt")" != 0 ]; then
            echo "::error::UNTRUSTED: $(wc -l < "$D/missing.txt") run(s) have no summary.json and $(cut -f2 "$D/not-clean.txt" | sort -u | wc -l) step(s) are not clean; see not-clean.txt in the census-diff artifact"
            cat "$D/not-clean.txt"
            exit 1
          fi
      - name: Fail when any head's census differs from the base
        if: ${{ !cancelled() }}
        run: |
          D="$RUNNER_TEMP/diff"
          cat "$D/verdict.txt"
          if [ ! -f "$D/census-failed.txt" ] || [ -s "$D/census-failed.txt" ]; then
            echo "::error::CENSUS FAILED: $(cut -f1 "$D/census-failed.txt" 2>/dev/null | sort | uniq -c | awk '{printf "%s%s on %s step(s)", NR>1?", ":"", $2, $1}'); see census-failed.txt and diff-<head>.txt in the census-diff artifact"
            cat "$D/census-failed.txt"
            exit 1
          fi
