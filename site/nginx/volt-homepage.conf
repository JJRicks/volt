# Managed Volt homepage (volt.jjricks.com). Installed as /etc/nginx/sites-available/volt-homepage.
# Static files only. Releases live in /var/www/volt-home/releases/<commit>; "current" points at one.
# "live" points at one variant of a release, releases/<commit>/variants/<name>, and is the site root.
# Only the root-owned volt-homepage-switch helper changes it (site/server/), atomically, so switching
# the live variant needs no nginx reload. Every variant is also served at /preview/<name>/.
# Preserve the ACME webroot: unattended certificate renewal uses it over port 80.
server {
    listen 80;
    listen [::]:80;
    server_name volt.jjricks.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/volt-home-acme;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 308 https://volt.jjricks.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name volt.jjricks.com;
    ssl_certificate /etc/letsencrypt/live/volt.jjricks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volt.jjricks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    access_log off;

    # The private Workbench (/dev/) and the NAVEE debugger (/debugger/); installed by the Workbench's
    # deploy/install.py, outside this repository. Keep this include when replacing this file.
    include /etc/nginx/snippets/volt-dev.conf;

    root /var/www/volt-home/live;
    index index.html;
    autoindex off;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/svg+xml svg;
        image/png png;
        image/webp webp;
        font/ttf ttf;
        application/manifest+json webmanifest;
        text/plain txt;
        application/xml xml;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json text/plain application/xml;

    # Server-level headers apply to every location below that adds none of its own. A location with
    # any add_header inherits none of these, so /preview/ repeats them all (tests/site-homepage-test.py
    # checks that every location with add_header carries every one of them).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/volt-home-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = / {
        limit_except GET { deny all; }
        expires epoch;
        try_files /index.html =404;
    }
    location / {
        limit_except GET { deny all; }
        expires 1h;
        try_files $uri =404;
    }

    # Every variant of the current release, for the owner to look at before making one live. Hidden
    # from search: robots.txt disallows /preview/ and every response says noindex.
    location ^~ /preview/ {
        root /var/www/volt-home/current/variants;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # The four names only. Nested locations add no headers, so they inherit the ones above.
        location ~ ^/preview/(original|refined|hybrid|app)$ {
            return 308 /preview/$1/;
        }
        location ~ ^/preview/(original|refined|hybrid|app)/$ {
            limit_except GET { deny all; }
            expires epoch;
            try_files /$1/index.html =404;
        }
        location ~ ^/preview/(original|refined|hybrid|app)/(.+)$ {
            limit_except GET { deny all; }
            expires 1h;
            try_files /$1/$2 =404;
        }
        return 404;
    }
}
