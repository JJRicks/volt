<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Link-preview card for the "clean" homepage variant, in the Volt app's own tokens. Rendered by render-clean-og.sh
   into site/variants/clean/og.png. Values are the sample Clean Home readings shown on the page. */
@font-face{font-family:Saira;src:url("../../../res/font/saira_regular.ttf");font-weight:400;font-display:block}
@font-face{font-family:Saira;src:url("../../../res/font/saira_medium.ttf");font-weight:500;font-display:block}
@font-face{font-family:Saira;src:url("../../../res/font/saira_semibold.ttf");font-weight:600;font-display:block}
@font-face{font-family:Saira;src:url("../../../res/font/saira_bold.ttf");font-weight:700;font-display:block}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111211;color:#F4F5F0;font-family:Saira,sans-serif}
.wrap{position:relative;width:1200px;height:630px}
.copy{position:absolute;left:72px;top:64px;width:560px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px}
.disc{width:56px;height:56px;border-radius:50%;background:#111211;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);overflow:hidden}
.disc svg{width:100%;height:100%;display:block}
h1{margin:64px 0 0;font-weight:700;font-size:76px;line-height:1.04}
p{margin:26px 0 0;font-size:25px;line-height:1.45;color:#9A9C95}
.url{position:absolute;left:72px;bottom:54px;font-size:22px;color:#9A9C95}
.home{position:absolute;left:700px;top:40px;width:430px}
.st{font-size:16px;color:#9A9C95}
.nm{display:flex;align-items:center;font-size:30px;font-weight:700;line-height:1.25;margin-top:2px}
.nm span{flex:1}
.hd{width:46px;height:46px;border-radius:50%;background:#1F201E;margin-left:8px;display:grid;place-items:center}
.hd svg{width:20px;height:20px;fill:none;stroke:#F4F5F0;stroke-width:1.8;stroke-linecap:round}
.card{margin-top:14px;height:232px;border-radius:22px;background:#1F201E;padding:20px 22px;box-sizing:border-box;display:flex;flex-direction:column}
.cap{font-size:16px;color:#9A9C95}
.pct{font-size:76px;font-weight:700;line-height:1;margin-top:6px}
.pct small,.rd small{font-size:.42em;color:#9A9C95;font-weight:500;margin-left:4px}
.rng{font-size:18px;color:#9A9C95;margin-top:4px}
.bar{height:9px;border-radius:5px;background:#2A2B28;margin-top:auto}
.bar i{display:block;width:78%;height:100%;border-radius:5px;background:#E32B2F}
.lock{position:relative;margin-top:14px;height:64px;border-radius:22px;background:linear-gradient(90deg,rgba(227,43,47,.32),rgba(227,43,47,.08));box-shadow:inset 0 0 0 1px rgba(227,43,47,.43);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.thumb{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;background:#E32B2F;display:grid;place-items:center}
.thumb svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.q{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;text-align:center;font-size:16px}
.q b{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 8px;border-radius:50%;background:#2A2B28}
.q svg{width:26px;height:26px;fill:none;stroke:#FF8A8C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.q .f{fill:#FF8A8C;stroke:none}
.sample{position:absolute;right:22px;top:20px;font-size:14px;color:#9A9C95;background:#2A2B28;border-radius:100px;padding:2px 12px}
</style></head><body><div class="wrap">
<div class="copy">
 <div class="brand"><span class="disc"><svg viewBox="18 18 72 72"><path fill="#EA252B" d="M66,27 L38,61 L54,61 L49,86 L79,50 L62,50 Z"/><path fill="#F5F5EF" d="M62,24 L34,58 L50,58 L45,83 L75,47 L58,47 Z"/></svg></span>Volt</div>
 <h1>Your scooter, no cloud.</h1>
 <p>An independent, open source Android app for NAVEE scooters. No account, and it works offline.</p>
</div>
<div class="url">volt.jjricks.com</div>
<div class="home">
 <div class="st">Connected · Sport</div>
 <div class="nm"><span>Midnight Runner</span><i class="hd"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></i><i class="hd"><svg viewBox="0 0 24 24"><path stroke-linejoin="round" d="M20.8 10.2 L20.8 13.8 L18.6 14.2 L18.3 15.1 L19.5 17.0 L17.0 19.5 L15.1 18.3 L14.2 18.6 L13.8 20.8 L10.2 20.8 L9.8 18.6 L8.9 18.3 L7.0 19.5 L4.5 17.0 L5.7 15.1 L5.4 14.2 L3.2 13.8 L3.2 10.2 L5.4 9.8 L5.7 8.9 L4.5 7.0 L7.0 4.5 L8.9 5.7 L9.8 5.4 L10.2 3.2 L13.8 3.2 L14.2 5.4 L15.1 5.7 L17.0 4.5 L19.5 7.0 L18.3 8.9 L18.6 9.8z"/><circle cx="12" cy="12" r="2.8"/></svg></i></div>
 <div class="card" style="position:relative">
  <span class="sample">Sample</span>
  <div class="cap">Battery</div>
  <div class="pct">78<small>%</small></div>
  <div class="rng">about 24 mi left</div>
  <div class="bar"><i></i></div>
 </div>
 <div class="lock"><span class="thumb"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg></span>Unlocked</div>
 <div class="q">
  <div><b><svg viewBox="0 0 24 24"><path d="M4.5 16a7.5 7.5 0 1 1 15 0"/><path d="m12 16 3.5-4.5"/></svg></b>Ride</div>
  <div><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle class="f" cx="12" cy="12" r="3.4"/></svg></b>Record</div>
  <div><b><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.8M9.5 3h5"/></svg></b>Charge by</div>
  <div><b><svg viewBox="0 0 24 24"><path d="M4.5 15.5a7.5 7.5 0 0 1 15 0"/><path d="M12 15.5V10M8 19.5h8"/></svg></b>Cruise</div>
 </div>
</div>
</div></body></html>
